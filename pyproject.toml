[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teleshield"
version = "1.0.0"
description = "TeleShield: Quantum-Inspired Cyber Threat Detection Framework for Teleportation-Based Quantum Digital Signatures"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TeleShield Quantum Cyber Research Team" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "plotly>=5.19.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.28",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.14.0",
    "stim>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["teleshield*"]
